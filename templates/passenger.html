<!doctype html>
<html>
  <head>
    <title>Passenger Dashboard</title>
    <link rel="icon" type="image/png" href="/static/bus.png" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f0f2f5;
      }
      .navbar {
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 15px 30px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }
      .navbar h1 {
        font-size: 22px;
      }
      .navbar-links a,
      .navbar-links button {
        color: white;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.2);
        padding: 8px 15px;
        border-radius: 8px;
        margin-left: 10px;
        border: none;
        cursor: pointer;
        font-size: 14px;
      }
      .search-box {
        background: white;
        padding: 25px 30px;
        margin: 20px 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }
      .search-box h3 {
        color: #667eea;
        margin-bottom: 15px;
        font-size: 18px;
      }
      .search-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .input-group {
        position: relative;
      }
      .input-group input {
        padding: 12px 15px 12px 40px;
        border: 2px solid #eee;
        border-radius: 10px;
        font-size: 15px;
        width: 200px;
        transition: 0.3s;
      }
      .input-group input:focus {
        border-color: #667eea;
        outline: none;
      }
      .input-group span {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
      }
      .search-btn {
        padding: 12px 25px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
        transition: 0.3s;
      }
      .search-btn:hover {
        transform: scale(1.02);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
      .loader {
        display: none;
        text-align: center;
        padding: 20px;
      }
      .spinner {
        border: 4px solid #eee;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .bus-list {
        display: flex;
        gap: 15px;
        padding: 0 30px 20px;
        flex-wrap: wrap;
      }
      .bus-card {
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        width: 280px;
        transition: 0.3s;
        animation: fadeIn 0.5s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .bus-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
      }
      .bus-card-header {
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 15px 20px;
        color: white;
      }
      .bus-card-header h4 {
        font-size: 18px;
        margin-bottom: 3px;
      }
      .bus-card-header p {
        font-size: 13px;
        opacity: 0.85;
      }
      .bus-card-body {
        padding: 15px 20px;
      }
      .bus-card-body p {
        color: #555;
        font-size: 14px;
        margin: 6px 0;
      }
      .status-badge {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        margin-top: 8px;
      }
      .status-green {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .status-yellow {
        background: #fff8e1;
        color: #f57f17;
      }
      .status-red {
        background: #ffebee;
        color: #c62828;
      }
      .info-bar {
        display: flex;
        gap: 15px;
        padding: 0 30px 20px;
        flex-wrap: wrap;
      }
      .info-card {
        background: white;
        padding: 12px 20px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        font-size: 14px;
        color: #555;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .info-card.green {
        border-left: 4px solid #4caf50;
      }
      .info-card.blue {
        border-left: 4px solid #667eea;
      }
      .info-card.purple {
        border-left: 4px solid #764ba2;
      }
      #scheduleDiv {
        display: none;
        background: white;
        margin: 0 30px 20px;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }
      #scheduleDiv h3 {
        color: #667eea;
        margin-bottom: 15px;
      }
      #scheduleTable {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
      }
      #scheduleTable th {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        padding: 12px;
      }
      #scheduleTable td {
        padding: 10px;
        border-bottom: 1px solid #f0f2f5;
      }
      #scheduleTable tr:hover td {
        background: #f8f9ff;
      }
      #map {
        height: 450px;
        margin: 0 30px 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }
      @media (max-width: 768px) {
        .navbar h1 {
          font-size: 16px;
        }
        .search-box {
          margin: 10px;
          padding: 15px;
        }
        .input-group input {
          width: 100%;
        }
        .search-btn {
          width: 100%;
        }
        .bus-list {
          padding: 0 10px 20px;
        }
        .bus-card {
          width: 100%;
        }
        .info-bar {
          padding: 0 10px 20px;
        }
        #map {
          margin: 0 10px 20px;
          height: 300px;
        }
        #scheduleDiv {
          margin: 0 10px 20px;
        }
      }
      body.dark {
        background: #1a1a2e;
        color: white;
      }
      body.dark .search-box,
      body.dark .bus-card,
      body.dark .info-card,
      body.dark #scheduleDiv {
        background: #16213e;
        color: white;
      }
      body.dark .bus-card-body p,
      body.dark .info-card {
        color: #ccc;
      }
      body.dark #scheduleTable td {
        border-color: #333;
      }
      body.dark #scheduleTable tr:hover td {
        background: #0f3460;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <h1>🚌 Passenger Dashboard</h1>
      <div class="navbar-links">
        <a href="/profile">👤 Profile</a>
        <button onclick="toggleDark()" id="darkBtn">🌙 Dark</button>
        <a href="/logout">Logout</a>
      </div>
    </div>

    <div class="search-box">
      <h3>🔍 Search Bus</h3>
      <div class="search-row">
        <div class="input-group">
          <span>📍</span>
          <input type="text" id="from" placeholder="From (e.g. Delhi)" />
        </div>
        <div class="input-group">
          <span>🏁</span>
          <input type="text" id="to" placeholder="To (e.g. Agra)" />
        </div>
        <button class="search-btn" onclick="searchBus()">🔍 Search</button>
        <button
          class="search-btn"
          onclick="startVoice()"
          style="background: linear-gradient(135deg, #e94560, #c0392b)"
        >
          🎤 Voice
        </button>
      </div>
    </div>

    <div class="loader" id="loader"><div class="spinner"></div></div>

    <div id="scheduleDiv">
      <h3>🕐 Bus Schedule</h3>
      <table id="scheduleTable">
        <tr>
          <th>🚌 Bus</th>
          <th>🕐 Departure</th>
          <th>🏁 Arrival</th>
          <th>📅 Days</th>
        </tr>
      </table>
    </div>

    <div class="bus-list" id="busList"></div>

    <div class="info-bar">
      <div class="info-card green">🟢 Bus Live Tracking Active</div>
      <div class="info-card blue">
        <span id="eta">⏱️ ETA: Calculating...</span>
      </div>
      <div class="info-card purple">
        <span id="liveCount">👥 Live Passengers: -</span>
      </div>
    </div>

    <div id="map"></div>

    <script>
      var map = L.map("map").setView([20.5937, 78.9629], 5);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(
        map,
      );
      var marker;
      var socket = io();

      socket.on("bus_location", function (data) {
        if (marker) {
          marker.setLatLng([data.lat, data.lng]);
        } else {
          marker = L.marker([data.lat, data.lng]).addTo(map);
        }
        map.setView([data.lat, data.lng], 15);

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(function (pos) {
            var distance = map.distance(
              [pos.coords.latitude, pos.coords.longitude],
              [data.lat, data.lng],
            );
            var km = distance / 1000;

            fetch("/predict_eta", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ distance: km }),
            })
              .then((r) => r.json())
              .then((eta) => {
                document.getElementById("eta").innerHTML =
                  `⏱️ ETA: ${eta.eta} min | 🚗 Speed: ${eta.speed} km/h`;
              });

            if (distance < 1000) {
              if (Notification.permission === "granted") {
                new Notification("🚌 Bus Alert!", {
                  body: "Bus 1 km paas hai!",
                });
              } else {
                Notification.requestPermission();
              }
            }
          });
        }
      });

      socket.on("passenger_update", function (data) {
        document.getElementById("liveCount").innerHTML =
          "👥 Live Passengers: " + data.count;
      });

      function searchBus() {
        var from = document.getElementById("from").value;
        var to = document.getElementById("to").value;
        document.getElementById("loader").style.display = "block";
        document.getElementById("scheduleDiv").style.display = "block";
        document.getElementById("scheduleTable").innerHTML =
          "<tr><th>🚌 Bus</th><th>🕐 Departure</th><th>🏁 Arrival</th><th>📅 Days</th></tr>";

        fetch("/search_bus?from=" + from + "&to=" + to)
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("loader").style.display = "none";
            var list = document.getElementById("busList");
            list.innerHTML = "";
            if (data.length == 0) {
              list.innerHTML =
                '<p style="padding:20px;color:#888;">No bus found!</p>';
              document.getElementById("scheduleDiv").style.display = "none";
              return;
            }
            data.forEach((bus) => {
              var seats_left = Math.max(
                0,
                bus.total_seats - bus.current_passengers,
              );
              var status =
                seats_left > 10
                  ? '<span class="status-badge status-green">🟢 Seats Available</span>'
                  : seats_left > 0
                    ? '<span class="status-badge status-yellow">🟡 Almost Full</span>'
                    : '<span class="status-badge status-red">🔴 Full</span>';
              list.innerHTML += `
                                          <div class="bus-card">
                                              <div class="bus-card-header">
                                                  <h4>🚌 ${bus.bus_number}</h4>
                                                  <p>📛 ${bus.bus_name || "N/A"}</p>
                                              </div>
                                              <div class="bus-card-body">
                                                  <p>🛣️ ${bus.route_name}</p>
                                                  <p>📍 ${bus.start_point} → ${bus.end_point}</p>
                                                  <p>👥 ${bus.current_passengers}/${bus.total_seats} Passengers</p>
                                                  ${status}
                                              </div>
                                          </div>`;
            });
            fetch("/get_schedules?bus_number=" + data[0].bus_number)
              .then((r) => r.json())
              .then((sdata) => {
                sdata.forEach((s) => {
                  document.getElementById("scheduleTable").innerHTML +=
                    `<tr><td>${s.bus_number}</td><td>${s.departure}</td><td>${s.arrival}</td><td>${s.days}</td></tr>`;
                });
              });
          });
      }

      function toggleDark() {
        document.body.classList.toggle("dark");
        var isDark = document.body.classList.contains("dark");
        document.getElementById("darkBtn").innerText = isDark
          ? "☀️ Light"
          : "🌙 Dark";
        localStorage.setItem("darkMode", isDark);
      }
      if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark");
        document.getElementById("darkBtn").innerText = "☀️ Light";
      }
      function startVoice() {
        if (!("webkitSpeechRecognition" in window)) {
          alert("Voice search supported nahi hai!");
          return;
        }
        var recognition = new webkitSpeechRecognition();
        recognition.lang = "hi-IN";
        recognition.start();

        recognition.onresult = function (event) {
          var speech = event.results[0][0].transcript;
          console.log("Voice:", speech);

          // Hindi "से" split
          if (speech.includes(" से ")) {
            var words = speech.split(" से ");
            document.getElementById("from").value = words[0].trim();
            document.getElementById("to").value = words[1]
              .replace("ढूंढो", "")
              .replace("बस", "")
              .replace("जाना है", "")
              .replace("जाना", "")
              .replace("कॉलेज", "")
              .trim();
          } else {
            // Single location - put in from field
            document.getElementById("from").value = speech.trim();
          }
          searchBus();
        };

        recognition.onerror = function () {
          alert("Voice nahi suni! Dobara try karo.");
        };
      }
      function toggleChat() {
        var chat = document.getElementById("chatbot");
        var btn = document.getElementById("chatBtn");
        if (chat.style.display === "none") {
          chat.style.display = "block";
          btn.style.display = "none";
        } else {
          chat.style.display = "none";
          btn.style.display = "block";
        }
      }

      function sendMessage() {
        var input = document.getElementById("chatInput");
        var msg = input.value;
        if (!msg) return;

        var messages = document.getElementById("chatMessages");
        messages.innerHTML += `<div style="text-align:right; margin:5px 0;"><span style="background:#667eea; color:white; padding:6px 12px; border-radius:10px; display:inline-block;">${msg}</span></div>`;
        input.value = "";

        fetch("/chatbot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg }),
        })
          .then((r) => r.json())
          .then((data) => {
            messages.innerHTML += `<div style="margin:5px 0;"><span style="background:#f0f2f5; padding:6px 12px; border-radius:10px; display:inline-block;">${data.reply}</span></div>`;
            messages.scrollTop = messages.scrollHeight;
          });
      }
    </script>
    <!-- chatbot -->
    <div
      id="chatbot"
      style="
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 300px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      "
    >
      <div
        style="
          background: linear-gradient(135deg, #667eea, #764ba2);
          padding: 15px;
          border-radius: 15px 15px 0 0;
          color: white;
          display: flex;
          justify-content: space-between;
        "
      >
        <b>🤖 Bus Assistant</b>
        <span onclick="toggleChat()" style="cursor: pointer">✕</span>
      </div>
      <div
        id="chatMessages"
        style="height: 250px; overflow-y: auto; padding: 15px; font-size: 14px"
      ></div>
      <div
        style="
          padding: 10px;
          display: flex;
          gap: 8px;
          border-top: 1px solid #eee;
        "
      >
        <input
          type="text"
          id="chatInput"
          placeholder="Kuch poochho..."
          style="
            flex: 1;
            padding: 8px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
          "
        />
        <button
          onclick="sendMessage()"
          style="
            padding: 8px 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
          "
        >
          ➤
        </button>
      </div>
    </div>

    <button
      onclick="toggleChat()"
      style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        font-size: 24px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.5);
        z-index: 1000;
      "
      id="chatBtn"
    >
      💬
    </button>
  </body>
</html>
