<!doctype html>
<html>
  <head>
    <title>Bus Tracking Login</title>
    <link rel="icon" type="image/png" href="/static/bus.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .top-logo {
        text-align: center;
        margin-bottom: 25px;
        color: white;
      }
      .top-logo .bus-icon {
        font-size: 60px;
        animation: bounce 2s infinite;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .top-logo h1 {
        font-size: 24px;
        margin-top: 10px;
      }
      .top-logo p {
        font-size: 14px;
        opacity: 0.85;
        margin-top: 5px;
      }

      .card {
        background: white;
        border-radius: 24px;
        padding: 30px 25px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      }
      .card h2 {
        color: #333;
        font-size: 22px;
        margin-bottom: 5px;
      }
      .card p {
        color: #999;
        font-size: 14px;
        margin-bottom: 25px;
      }

      .input-group {
        position: relative;
        margin-bottom: 15px;
      }
      .input-group .icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
      }
      .input-group input {
        width: 100%;
        padding: 14px 14px 14px 44px;
        border: 2px solid #eee;
        border-radius: 12px;
        font-size: 15px;
        transition: 0.3s;
      }
      .input-group input:focus {
        border-color: #667eea;
        outline: none;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }
      .input-group input.valid {
        border-color: #4caf50;
      }
      .input-group input.invalid {
        border-color: #ef5350;
      }

      .remember-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        font-size: 14px;
      }
      .remember-row label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #666;
        cursor: pointer;
      }
      .remember-row a {
        color: #667eea;
        text-decoration: none;
      }

      .btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
      }
      .btn:hover {
        transform: scale(1.01);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      }

      .divider {
        text-align: center;
        color: #ccc;
        margin: 20px 0;
        font-size: 13px;
      }

      .register-link {
        text-align: center;
        font-size: 14px;
        color: #666;
      }
      .register-link a {
        color: #667eea;
        font-weight: 700;
        text-decoration: none;
      }

      .error {
        color: #ef5350;
        text-align: center;
        font-size: 14px;
        margin-top: 10px;
      }

      #lockTimer {
        background: #fff3e0;
        border: 1px solid #ffcc02;
        border-radius: 10px;
        padding: 12px;
        text-align: center;
        color: #e65100;
        margin-top: 10px;
        font-weight: 600;
      }

      .footer {
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        margin-top: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="top-logo">
      <h1>Smart Bus Tracking</h1>
      <p>Your Bus in real-time</p>
    </div>

    <div class="card">
      <h2 style="text-align: center">Welcome Back! 👋</h2>
      <p style="text-align: center">Sign in to continue</p>

      <form action="/login" method="POST" onsubmit="return validate();">
        <div class="input-group">
          <span class="icon">✉️</span>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Enter your email"
            oninput="validateEmail()"
          />
        </div>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter your password"
            oninput="validatePassword()"
          />
        </div>

        <div class="remember-row">
          <label><input type="checkbox" name="remember" /> Remember me</label>
          <a href="/forgot_password">Forgot Password?</a>
        </div>

        <button type="submit" class="btn" id="loginBtn">Sign In →</button>
      </form>

      {% if error %}
      <p class="error">❌ {{ error }}</p>
      {% endif %} {% if lockout %}
      <div id="lockTimer">
        🔒 Too many attempts! Wait <span id="countdown">180</span>s
        <script>
          var time = 180;
          document.getElementById("loginBtn").disabled = true;
          document.getElementById("email").disabled = true;
          document.getElementById("password").disabled = true;
          var t = setInterval(function () {
            time--;
            document.getElementById("countdown").innerText = time;
            if (time <= 0) {
              clearInterval(t);
              location.reload();
            }
          }, 1000);
        </script>
      </div>
      {% endif %}

      <div class="divider">— OR —</div>
      <div class="register-link">
        Don't have an account? <a href="/register">Register here</a>
      </div>
    </div>

    <p class="footer">© 2026 Smart Bus Tracking System</p>

    <script>
      function validateEmail() {
        var e = document.getElementById("email");
        var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        e.classList.toggle("valid", re.test(e.value));
        e.classList.toggle("invalid", !re.test(e.value) && e.value.length > 0);
      }
      function validatePassword() {
        var p = document.getElementById("password");
        p.classList.toggle("valid", p.value.length >= 4);
        p.classList.toggle("invalid", p.value.length > 0 && p.value.length < 4);
      }
      function validate() {
        if (
          !document.getElementById("email").value ||
          !document.getElementById("password").value
        ) {
          alert("Please fill all fields!");
          return false;
        }
        document.getElementById("loginBtn").innerText = "Signing in...";
        return true;
      }
    </script>
  </body>
</html>
