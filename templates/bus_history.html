<!doctype html>
<html>
  <head>
    <link rel="icon" type="image/png" href="/static/bus.png" />
    <title>Bus History</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f0f2f5;
      }
      .navbar {
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 15px 30px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .navbar h1 {
        font-size: 22px;
      }
      .navbar a {
        color: white;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.2);
        padding: 8px 15px;
        border-radius: 8px;
        margin-left: 10px;
      }
      .container {
        padding: 30px;
      }
      .section {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        margin-bottom: 25px;
      }
      h3 {
        color: #667eea;
        margin-bottom: 15px;
      }
      select {
        padding: 10px;
        border: 2px solid #eee;
        border-radius: 8px;
        font-size: 14px;
        margin-right: 10px;
        width: 200px;
      }
      button {
        padding: 10px 20px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
      }
      #map {
        height: 400px;
        border-radius: 15px;
        margin-top: 15px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #eee;
      }
      th {
        background: #f8f9fa;
        color: #667eea;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <h1>📍 Bus History</h1>
      <div>
        <a href="/admin">Dashboard</a>
        <a href="/logout">Logout</a>
      </div>
    </div>
    <div class="container">
      <div class="section">
        <h3>🚌 Select Bus</h3>
        <select id="bus_select">
          <option value="">Select Bus</option>
        </select>
        <button onclick="loadHistory()">View History</button>
        <div id="map"></div>
      </div>
      <div class="section">
        <h3>📋 History Log</h3>
        <table id="historyTable">
          <tr>
            <th>Bus</th>
            <th>Location</th>
            <th>Time</th>
          </tr>
        </table>
      </div>
    </div>

    <script>
      var map = L.map("map").setView([20.5937, 78.9629], 5);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(
        map,
      );

      fetch("/get_buses")
        .then((r) => r.json())
        .then((data) => {
          data.forEach((b) => {
            document.getElementById("bus_select").innerHTML +=
              `<option value="${b.id}">${b.bus_number}</option>`;
          });
        });

      function loadHistory() {
        var bus_id = document.getElementById("bus_select").value;
        fetch("/get_history?bus_id=" + bus_id)
          .then((r) => r.json())
          .then((data) => {
            var table = document.getElementById("historyTable");
            table.innerHTML =
              "<tr><th>Bus</th><th>Location</th><th>Date and Time</th></tr>";
            var points = [];
            data.forEach((h) => {
              table.innerHTML += `<tr>
                <td>${h.bus_number}</td>
                <td>${h.lat.toFixed(4)}, ${h.lng.toFixed(4)}</td>
                <td>${h.time}</td>
            </tr>`;
              points.push([h.lat, h.lng]);
              L.marker([h.lat, h.lng]).addTo(map);
            });
            if (points.length > 0) {
              L.polyline(points, { color: "#667eea" }).addTo(map);
              map.fitBounds(points);
            }
          });
      }
    </script>
  </body>
</html>
