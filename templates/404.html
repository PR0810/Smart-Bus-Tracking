<!doctype html>
<html>
  <head>
    <link rel="icon" type="image/png" href="/static/bus.png" />
    <title>404 - Not Found</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }
      h1 {
        font-size: 100px;
        color: #667eea;
      }
      h2 {
        color: #333;
        margin: 10px 0;
      }
      p {
        color: #888;
        margin-bottom: 25px;
      }
      a {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        padding: 12px 30px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you are looking for does not exist.</p>
      <a href="/login">← Back to Home</a>
    </div>
  </body>
</html>
